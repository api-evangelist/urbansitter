name: UrbanSitter
description: UrbanSitter is an online marketplace that connects families with trusted
  local caregivers, including babysitters, nannies, child care providers, daycares
  and preschools, tutors, pet sitters, senior caregivers, and household help. Operated
  by UrbanSitter, Inc., the platform lets parents browse caregiver profiles, read
  reviews from other families, compare pay rates, and book and pay sitters, while
  caregivers find and manage child care and home care jobs. UrbanSitter runs its platform on a private
  Spring Boot API (Swagger UI is IP-safelisted) and does not publish a public developer
  program.
